{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit profile page</title>

    <link rel="stylesheet" href="{% static 'css/editProfile.css' %}">

    <style>
        .errorMail {
            color: red;
            font-size: 13px;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    {% include 'navbar.html' %}

        {% if messages %}
    {% for m1 in messages %}
    <script>
        alert(" {{m1}} ")
    </script>
    {% endfor %}
    {% endif %}

    

    <div class="full_form">
        <h1 class="editFormTEXT">Edit Profile</h1>
        <form method="POST">

            {% csrf_token %}

            <div class="group">
                <label>First Name</label>
                <input type="text" placeholder="Enter first name" name="first_namE" value="{{user.first_name}}"
                    required>
            </div>

            <div class="group">
                <label>Last Name</label>
                <input type="text" placeholder="Enter Last name" name="last_namE" value="{{user.last_name}}" required>
            </div>

            <div class="group">
                <label>Username</label>
                <input type="text" placeholder="Enter Username" name="usernaME" value="{{user.username}}" required>
                {% if error_username %}
                <p class="errorMail">{{error_username}}</p>
                {% endif %}
            </div>


            <div class="group">
                <label>Email</label>
                <input type="text" placeholder="Enter Email" name="emaiL" value="{{user.email}}" required>
                {% if error_email %}
                <p class="errorMail">{{error_email}}</p>
                {% endif %}
            </div>

            <div class="group">
                <button class="submit">Submit</button>
            </div>
        </form>

    </div>



    {% include 'footer.html' %}



</body>

</html>
