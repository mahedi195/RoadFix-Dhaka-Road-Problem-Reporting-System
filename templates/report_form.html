{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Problem</title>
    <link rel="stylesheet" href="{% static 'css/reportForm.css' %}">


    <style>
     
    </style>
</head>

<body>

    {% include 'navbar.html' %}

    <form action="" method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <div class="full_form">
            <h1 class="report_a_prb_text">Report a Road Problem</h1>


            <div class="container">

                <div class="group">
                    <label>Problem Title</label>
                    <input name="title" type="text" placeholder="e.g. Large Pathole " required>
                </div>

                <div class="group">
                    <label>Problem Category</label>
                    <select name="category" required>
                        <option value="">Select a category</option>
                        <option value="pothole">Pothole</option>
                        <option value="damaged_road">Damaged Road</option>
                        <option value="waterlogging">Waterlogging</option>
                        <option value="broken_streetlight">Broken Streetlight</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>



            <div class="container">

                <div class="group">
                    <label>Problem location</label>
                    <input name="location" type="text" placeholder="e.g. Rampura Banasree B block" required>
                </div>

                <div class="group">
                    <label>Road information</label>
                    <input name="road_information" type="text" placeholder="e.g. Road No. 1,near House No. 12" required>
                </div>

                <div class="group">
                    <label>Problem Details </label>
                    <input name="additional_location_details" type="text" placeholder="e.g. The road behind Swapno or Wood & Fire Resturant" required>
                </div>

                <div class="group">
                    <label>Nearby landmarks (optional)</label>
                    <input name="nearby_landmark" type="text" placeholder="e.g. Near wood & Fire Resturant ">
                </div>

                

            </div>


            <div class="photoUpload">
                <label>Upload a Photo (optional) </label>
                <input  name="uploaded_photo" type="file" accept="image/*">

            </div>

            <div class="frutherDetails">
                <label>Further Details (optional)</label>
                <textarea name="further_details" placeholder="Describe the further details..."></textarea>
            </div>

            <button type="submit" class="submit">Submit Report</button>



            <div class="back_to_home">

                <a href="{% url 'index' %}">


                    <span class="arrow">
                        ←
                    </span>
                    <span class="back_home"> Back to home</span>


                </a>

            </div>



        </div>

    </form>

{% include 'footer.html' %}

</body>

</html>
