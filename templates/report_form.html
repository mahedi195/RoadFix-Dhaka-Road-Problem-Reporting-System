<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        h1 {
            color: #163b32;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            margin-bottom: 20px;
        }

        .group {
            display: flex;
            flex-direction: column;
            margin-right: 10px;
            margin-bottom: 15px;

        }

        input,
        select,
        textarea {
            border-radius: 5px;
            outline: 0;
            border: 1px solid #b7b7b7;
            padding: 8px 12px;
            font-size: 15px;
            box-shadow: 0px 2px 10px #c5c3c3;
        }

        label {
            /* border-bottom: 100px; */
            margin-bottom: 5px;
        }


        .frutherDetails {
            /* display: grid; */
            margin-top: 20px;
            /* min-height: 300px; */
            /* width: 100%; */
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        textarea {
            min-height: 100px;

            /* resize: vertical; */
            min-height: 80px;
        }


        .submit {
            display: flex;
            width: 100%;
            /* display: grid; */
            /* grid-template-columns: 1fr; */
            outline: 0;
            border: 1px solid #b4b1b1;
            border-radius: 5px;
            padding: 10px;
            /* text-align: center; */
            color: white;
            margin: 0 auto;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            background-color: #163b32;
            margin-bottom: 20px;
            box-shadow: 0px 2px 10px #c5c3c3;

            cursor: pointer;
        }


        .back_to_home span {
            color: #163b32;
        }


        .full_form {
            margin: 0;
            padding: 10px;
            max-width: 750px;
            margin: 50px auto;
            border: 1px solid #d9d9d9;
            border-radius: 5px;

        }

        .back_to_home {
            cursor: pointer;
        }

        .back_to_home a {
            text-decoration: none;
        }

        .report_a_prb_text {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 45px;
        }
    </style>
</head>

<body>

    <form action="" method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <div class="full_form">
            <h1 class="report_a_prb_text">Report a Road Problem</h1>


            <div class="container">

                <div class="group">
                    <label>Problem Title</label>
                    <input name="title" type="text" placeholder="e.g. Large Pathole " required>
                </div>

                <div class="group">
                    <label>Problem Category</label>
                    <select name="category" required>
                        <option value="">Select a category</option>
                        <option value="pothole">Pothole</option>
                        <option value="damaged_road">Damaged Road</option>
                        <option value="waterlogging">Waterlogging</option>
                        <option value="broken_streetlight">Broken Streetlight</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>



            <div class="container">

                <div class="group">
                    <label>Problem location</label>
                    <input name="location" type="text" placeholder="e.g. Rampura Banasree B block" required>
                </div>

                <div class="group">
                    <label>Road information</label>
                    <input name="road_information" type="text" placeholder="e.g. Road No. 1,near House No. 12" required>
                </div>

                <div class="group">
                    <label>Problem Details </label>
                    <input name="additional_location_details" type="text" placeholder="e.g. The road behind Swapno or Wood & Fire Resturant" required>
                </div>

                <div class="group">
                    <label>Nearby landmarks (optional)</label>
                    <input name="nearby_landmark" type="text" placeholder="e.g. Near wood & Fire Resturant ">
                </div>

                

            </div>


            <div class="photoUpload">
                <label>Upload a Photo (optional) </label>
                <input  name="uploaded_photo" type="file" accept="image/*">

            </div>

            <div class="frutherDetails">
                <label>Further Details (optional)</label>
                <textarea name="further_details" placeholder="Describe the further details..."></textarea>
            </div>

            <button type="submit" class="submit">Submit Report</button>



            <div class="back_to_home">

                <a href="{% url 'index' %}">


                    <span class="arrow">
                        ←
                    </span>
                    <span class="back_home"> Back to home</span>


                </a>

            </div>



        </div>

    </form>



</body>

</html>
