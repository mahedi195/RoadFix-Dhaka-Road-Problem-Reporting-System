
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
}

.full_login {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 30px 15px;
}

        .full_login form {
            width: 100%;
            max-width: 520px;
        }

        .fullForm {
            border: 1px solid rgb(182, 181, 181);
            width: 100%;
            border-radius: 5px;
            padding: 20px;
            box-shadow: 1px 2px 3px #a5a4a4;
        }

        .headerSection {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .headerSection h2 {
            margin: 0 0 7px;
            color: #1F4E78;
            font-weight: bold;
            font-size: 30px;
        }

        .headerSection p {
            margin: 0;
            font-size: 18px;
            color: #777676;
        }

        .welcomeSection h3 {
            margin: 0;
        }

        .fullForm > div {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 6px;
        }

        input[type='text'],
        input[type='password'] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 5px;
            border: 1px solid #c4bbbb;
            box-shadow: 1px 2px 2px #c0bdbd;
            outline: 0;
            font-size: 20px;
        }

        input[type='text']:focus,
        input[type='password']:focus {
            border-color: #1F4E78;
            box-shadow: 0 0 4px #1F4E78;
        }

        .rememberMe {
            display: flex;
            align-items: center;
            margin: 0;
        }

        .rememberMe_or_ForgetPassword {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
        }

        .ForgetPassword {
            margin: 0;
        }

        .rememberMe input,
        .rememberMe p {
            margin: 0;
        }

        .ForgetPassword p {
            margin: 0;
            color: #1F4E78;
            cursor: pointer;
        }

        .rememberMe input {
            margin-right: 6px;
        }

        .loginButton {
            margin-bottom: 15px;
        }

        .loginButton button {
            cursor: pointer;
            width: 100%;
            padding: 10px;
            font-size: 18px;
            border-radius: 5px;
            border: 1px solid #bbb8b8;
            box-shadow: 1px 2px 3px #b5b5b5;
            background-color: #1F4E78;
            color: white;
        }

        .loginButton button:hover {
            background-color: #163b5c;
        }

        .noAccount {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-bottom: 0;
        }

        .noAccount p {
            margin: 0;
            margin-right: 10px;
        }

        .noAccount a {
            color: #1F4E78;
            font-weight: bold;
            text-decoration: underline;
        }

        .error {
            margin-top: 10px;
            margin-bottom: 12px;
            font-size: 16px;
            color: red;
        }

        @media screen and (max-width: 480px) {
            .fullForm {
                padding: 15px;
            }

            .headerSection h2 {
                font-size: 26px;
            }

            label {
                font-size: 18px;
            }

            input[type='text'],
            input[type='password'] {
                font-size: 16px;
            }

            .noAccount {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    {% include 'navbar.html' %}

    <div class="full_login">

        <form method="POST">
            {% csrf_token %}

            <div class="fullForm">

                <div class="headerSection">
                    <h2>RoadFix Dhaka</h2>
                    <p>Let's make Dhaka's roads better</p>
                </div>

                <div class="email_username">
                    <label>Email or username</label>
                    <input type="text"
                           placeholder="Enter your email or username"
                           name="username"
                           value="{{ username }}"
                           required>
                </div>

                <div class="password">
                    <label>Password</label>
                    <input type="password"
                           placeholder="Enter your password"
                           name="password"
                           required>
                </div>

                {% if message %}
                    <p class="error">{{ message }}</p>
                {% endif %}

                <div class="rememberMe_or_ForgetPassword">

                    <div class="rememberMe">
                        <input type="checkbox" name="rememberMe">
                        <p>Remember me</p>
                    </div>

                    <div class="ForgetPassword">
                        <p>Forgot Password?</p>
                    </div>

                </div>

                <div class="loginButton">
                    <button type="submit">Login</button>
                </div>

                <div class="noAccount">
                    <p>Don't have an account?</p>
                    <a href="{% url 'registerMe' %}">Register</a>
                </div>

            </div>

        </form>

    </div>

    {% include 'footer.html' %}

</body>

</html>
